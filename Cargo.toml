[package]
name = "gpp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A GPU-accelerated video player built with GPUI"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/giantpand2000/GPP"
repository = "https://github.com/giantpand2000/GPP"
publish = false
keywords = ["gpui", "video", "player", "gstreamer"]
categories = ["multimedia", "gui"]

[dependencies]
env_logger = "0.11"
gpui = "0.2.2"
gpui-video-player = { path = "crates/gpui-video-player" }
gstreamer-app = "0.24"
log = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
